name: Verify Numeriq
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-output
          path: |
            package-lock.json
            test-results/
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save supabase
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-integration.mjs
        env:
          RUN_AUTH_BROWSER: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: authenticated-browser-failure
          path: test-results/
      - run: npx supabase stop
        if: always()

